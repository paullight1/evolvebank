name: Evolve Bank monorepo checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned application dependencies
        run: npm ci --ignore-scripts
      - name: Verify independent source snapshots, licence files and branding
        run: node scripts/verify-monorepo.mjs
      - name: Typecheck and build unified portal and API
        run: npm run typecheck && npm run build
      - name: Run money, API, ledger contract, and PostgreSQL tests
        run: npm test
  integrated-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate isolated sandbox secrets
        run: npm run setup:sandbox
      - name: Build pinned Blnk source and start the sandbox
        run: docker compose up --build --wait --wait-timeout 240
      - name: Verify real ledger and database flow
        run: npm run test:stack
      - name: Verify real ledger response loss and atomic rollback
        run: docker compose exec -T app node dist/server/scripts/verify-ledger.js
      - name: Verify restart and replay recovery
        run: |
          docker compose restart app blnk
          npm run test:stack -- --resume
      - name: Install browser for desktop and mobile tests
        run: npx playwright install --with-deps chromium
      - name: Verify customer journeys and screenshots
        run: npm run test:e2e
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-browser-evidence
          path: |
            test-results
            playwright-report
          retention-days: 7
      - name: Show service status on failure
        if: failure()
        run: docker compose ps
      - name: Stop the disposable test stack
        if: always()
        run: docker compose down -v
