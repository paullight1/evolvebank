name: Evolve Bank monorepo checks
on:
  push:
    branches: [main, feat/independent-monorepo-20261119]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent source snapshots, licence files and branding
        run: node scripts/verify-monorepo.mjs
      - name: Run sandbox quote unit tests
        run: npm test
